# The Cloudflare public hostname service URL is http://nodejs:3005.
# cloudflared joins this network, so that name is the Next.js service.

services:
  nodejs:
    build:
      context: .web-context
    image: gadgetmgmt-nodejs:latest
    env_file:
      - .env
      - .nextauth.env
      - .public-url.env
      - path: .runtime.env
        required: false
        format: raw
    environment:
      NODE_ENV: production
      # Auth.js rewrites every request to NEXTAUTH_URL/AUTH_URL when set. A
      # localhost value from .env would send login redirects and the
      # authjs.callback-url cookie to http://localhost:3000 through the tunnel.
      # Leave them empty so the public host comes from the request headers.
      NEXTAUTH_URL: ""
      AUTH_URL: ""
      NEXTAUTH_TRUST_HOST: "true"
      AUTH_TRUST_HOST: "true"
    network_mode: host
    command: ["node", "./node_modules/next/dist/bin/next", "start", "-H", "127.0.0.1", "-p", "3005"]
    restart: unless-stopped

  cloudflared:
    network_mode: host
    extra_hosts:
      - "nodejs:127.0.0.1"
    image: node:22.23.5-bookworm-slim
    user: "${HOST_UID}:${HOST_GID}"
    entrypoint: ["/usr/local/bin/cloudflared"]
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://nodejs:3005
      - run
      - --token-file
      - /etc/cloudflared/token
    volumes:
      - ./bin/cloudflared:/usr/local/bin/cloudflared:ro
      - ./.tunnel-token:/etc/cloudflared/token:ro
    depends_on:
      - nodejs
    restart: unless-stopped
