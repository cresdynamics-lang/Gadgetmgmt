name: Synchronize production owner password
on:
  workflow_dispatch:
    inputs:
      expected_owner_email:
        description: Verify the configured administrator email before applying it
        type: string
        default: ""
      send_verification_code:
        description: Request a real sign-in code for the administrator inbox
        type: boolean
        default: false
      sync_owner_password:
        description: Synchronize the configured owner password
        type: boolean
        default: true
      provision_database_login:
        description: Create the dedicated runtime login after verifying the existing app database
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify runtime secret handling
        run: node --test scripts/production-env.test.mjs

      - name: Prepare production runtime secrets
        env:
          EXPECTED_OWNER_EMAIL: ${{ inputs.expected_owner_email }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_TRUST_HOST: ${{ secrets.NEXTAUTH_TRUST_HOST }}
          INITIAL_OWNER_NAME: ${{ secrets.INITIAL_OWNER_NAME }}
          INITIAL_OWNER_EMAIL: ${{ secrets.INITIAL_OWNER_EMAIL }}
          INITIAL_OWNER_PASSWORD: ${{ secrets.INITIAL_OWNER_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          CATALOG_OPENING_STOCK: ${{ secrets.CATALOG_OPENING_STOCK }}
          MPESA_CONSUMER_KEY: ${{ secrets.MPESA_CONSUMER_KEY }}
          MPESA_CONSUMER_SECRET: ${{ secrets.MPESA_CONSUMER_SECRET }}
          MPESA_SHORTCODE: ${{ secrets.MPESA_SHORTCODE }}
          MPESA_PASSKEY: ${{ secrets.MPESA_PASSKEY }}
          MPESA_ENVIRONMENT: ${{ secrets.MPESA_ENVIRONMENT }}
          MPESA_TRANSACTION_TYPE: ${{ secrets.MPESA_TRANSACTION_TYPE }}
          MPESA_CALLBACK_SECRET: ${{ secrets.MPESA_CALLBACK_SECRET }}
          MPESA_C2B_CALLBACK_SECRET: ${{ secrets.MPESA_C2B_CALLBACK_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_REPLY_TO: ${{ secrets.MAIL_REPLY_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          AT_USERNAME: ${{ secrets.AT_USERNAME }}
          AT_API_KEY: ${{ secrets.AT_API_KEY }}
          AT_SENDER_ID: ${{ secrets.AT_SENDER_ID }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_PAYMENT_TEMPLATE: ${{ secrets.WHATSAPP_PAYMENT_TEMPLATE }}
          WHATSAPP_TEMPLATE_LANGUAGE: ${{ secrets.WHATSAPP_TEMPLATE_LANGUAGE }}
          WHATSAPP_PAY_BUTTON_INDEX: ${{ secrets.WHATSAPP_PAY_BUTTON_INDEX }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_INSIGHTS_MODEL: ${{ secrets.AI_INSIGHTS_MODEL }}
          STANBIC_ENVIRONMENT: ${{ secrets.STANBIC_ENVIRONMENT }}
          STANBIC_API_BASE_URL: ${{ secrets.STANBIC_API_BASE_URL }}
          STANBIC_OAUTH_TOKEN_URL: ${{ secrets.STANBIC_OAUTH_TOKEN_URL }}
          STANBIC_CLIENT_ID: ${{ secrets.STANBIC_CLIENT_ID }}
          STANBIC_CLIENT_SECRET: ${{ secrets.STANBIC_CLIENT_SECRET }}
          STANBIC_SCOPE: ${{ secrets.STANBIC_SCOPE }}
          STANBIC_MERCHANT_CODE: ${{ secrets.STANBIC_MERCHANT_CODE }}
          STANBIC_CALLBACK_URL: ${{ secrets.STANBIC_CALLBACK_URL }}
          STANBIC_CALLBACK_SECRET: ${{ secrets.STANBIC_CALLBACK_SECRET }}
          STANBIC_SUBSCRIPTION_KEY: ${{ secrets.STANBIC_SUBSCRIPTION_KEY }}
          RESEND_API_KEY_NOTIFICATIONS: ${{ secrets.RESEND_API_KEY_NOTIFICATIONS }}
          RESEND_API_KEY_ORDERS: ${{ secrets.RESEND_API_KEY_ORDERS }}
          RESEND_API_KEY_ACCOUNTS: ${{ secrets.RESEND_API_KEY_ACCOUNTS }}
          MAIL_FROM_NOTIFICATIONS: ${{ secrets.MAIL_FROM_NOTIFICATIONS }}
          MAIL_FROM_ORDERS: ${{ secrets.MAIL_FROM_ORDERS }}
          MAIL_FROM_ACCOUNTS: ${{ secrets.MAIL_FROM_ACCOUNTS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          AI_QUESTIONS_PER_HOUR: ${{ secrets.AI_QUESTIONS_PER_HOUR }}
        run: |
          umask 077
          node scripts/prepare-production-env.mjs "$RUNNER_TEMP/production-runtime.env"

      - name: Synchronize and verify owner password
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS || vars.DEPLOY_SSH_KNOWN_HOSTS }}
          SYNC_OWNER_PASSWORD: ${{ inputs.sync_owner_password }}
          PROVISION_DATABASE_LOGIN: ${{ inputs.provision_database_login }}
          OWNER_PASSWORD: ${{ secrets.INITIAL_OWNER_PASSWORD || secrets.INITIAL_USER_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          ssh_dir="${RUNNER_TEMP}/owner-ssh"
          mkdir -p "$ssh_dir"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          unset DEPLOY_SSH_KEY
          DEPLOY_PATH=${DEPLOY_PATH//$'\r'/}
          DEPLOY_PATH="${DEPLOY_PATH#"${DEPLOY_PATH%%[![:space:]]*}"}"
          DEPLOY_PATH="${DEPLOY_PATH%"${DEPLOY_PATH##*[![:space:]]}"}"
          case "$DEPLOY_PATH" in
            \"*\") DEPLOY_PATH=${DEPLOY_PATH#\"}; DEPLOY_PATH=${DEPLOY_PATH%\"} ;;
            \'*\') DEPLOY_PATH=${DEPLOY_PATH#\'}; DEPLOY_PATH=${DEPLOY_PATH%\'} ;;
          esac
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9._-]{0,31}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]*$ ]]
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          opts=(-i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" -o ConnectTimeout=30)
          scp "${opts[@]}" scripts/sync-production-owner.mjs "${remote}:${DEPLOY_PATH}/bin/sync-production-owner.mjs"
          scp "${opts[@]}" compose.yaml "${remote}:${DEPLOY_PATH}/compose.runtime-candidate.yaml"
          scp "${opts[@]}" "$RUNNER_TEMP/production-runtime.env" "${remote}:${DEPLOY_PATH}/.runtime.env.candidate"
          scp "${opts[@]}" scripts/apply-production-env.sh "${remote}:${DEPLOY_PATH}/bin/apply-production-env.sh"
          scp "${opts[@]}" scripts/provision-production-login.mjs "${remote}:${DEPLOY_PATH}/bin/provision-production-login.mjs"
          printf -v quoted_path '%q' "$DEPLOY_PATH"
          if [ "$PROVISION_DATABASE_LOGIN" = "true" ]; then
            ssh "${opts[@]}" "$remote" "cd $quoted_path && .node/bin/node bin/provision-production-login.mjs"
          fi
          ssh "${opts[@]}" "$remote" bash "${DEPLOY_PATH}/bin/apply-production-env.sh" "$DEPLOY_PATH"
          if [ "$SYNC_OWNER_PASSWORD" = "true" ]; then
            printf '%s' "$OWNER_PASSWORD" | ssh "${opts[@]}" "$remote" "cd $quoted_path && if docker info >/dev/null 2>&1; then docker compose exec -T nodejs node --input-type=module -e \"\$(cat bin/sync-production-owner.mjs)\"; else sudo -n docker compose exec -T nodejs node --input-type=module -e \"\$(cat bin/sync-production-owner.mjs)\"; fi"
          fi

      - name: Verify administrator access and optional email code
        if: inputs.sync_owner_password
        env:
          EXPECTED_OWNER_EMAIL: ${{ inputs.expected_owner_email }}
          VERIFY_OWNER_EMAIL_CODE: ${{ inputs.send_verification_code }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          INITIAL_OWNER_EMAIL: ${{ secrets.INITIAL_OWNER_EMAIL }}
          INITIAL_OWNER_PASSWORD: ${{ secrets.INITIAL_OWNER_PASSWORD }}
        run: node scripts/verify-production-owner.mjs

      - name: Remove temporary runtime secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/production-runtime.env"
